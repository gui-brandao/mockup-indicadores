<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Incubadora — Painel da equipe · Parque Tecnológico</title>
<meta name="theme-color" content="#0c3c60" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<!-- Painel de uso diário da equipe da Incubadora: startups, mentorias,
     indicadores e o guia da planilha, lendo a planilha Google Sheets
     (api/incubadora.js). Sem a planilha conectada, mostra os dados
     ilustrativos de data/incubadora.js com o selo avisando. -->
<div class="app-shell" id="app-shell">

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Recolher menu">‹</button>
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">🚀</div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-title">
          <span class="brand-title-top">PAINEL DA</span>
          <span class="brand-title-main">INCUBADORA</span>
        </div>
        <div class="sidebar-brand-sub">Parque Tecnológico</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <a class="nav-item" data-route="inicio" href="#/inicio"><span class="nav-icon">🏠</span><span class="nav-label">Startups</span></a>
      <a class="nav-item" data-route="tarefas" href="#/tarefas"><span class="nav-icon">✅</span><span class="nav-label">Tarefas</span></a>
      <a class="nav-item" data-route="mentorias" href="#/mentorias"><span class="nav-icon">📅</span><span class="nav-label">Mentorias</span></a>
      <a class="nav-item" data-route="incubadora" href="#/incubadora"><span class="nav-icon">📊</span><span class="nav-label">Indicadores &amp; Jornada</span></a>
      <a class="nav-item" data-route="guia" href="#/guia"><span class="nav-icon">📘</span><span class="nav-label">Como usar</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-footer-logo">IFEEC</div>
      <div class="sidebar-footer-tag">Instituto de Ciência e Tecnologia</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-heading">
        <div class="topbar-eyebrow">
          PARQUE TECNOLÓGICO · EQUIPE DA INCUBADORA
          <span class="mock-badge">● carregando…</span>
        </div>
        <h1 class="topbar-title" id="topbar-title">Incubadora &amp; Jornada</h1>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
    </header>

    <div class="content">
      <div class="toolbar">
        <div class="period-field">
          <span class="field-label">Período</span>
          <select class="select" id="period-select"></select>
        </div>
        <div class="flex gap-8 toolbar-acoes">
          <a class="btn btn-outline" id="btn-planilha" href="#" target="_blank" rel="noopener" hidden>📄 Abrir planilha</a>
          <button class="btn btn-primary" id="btn-present">⛶ Modo apresentação</button>
        </div>
      </div>

      <main id="view"></main>
    </div>
  </div>

</div>

<button class="btn btn-primary exit-present" id="btn-exit-present">✕ Sair da apresentação (Esc)</button>
<div class="toast" id="toast"></div>

<script src="assets/js/vendor/echarts.min.js"></script>

<script src="data/incubadora.js"></script>

<script src="assets/js/data-loader.js"></script>

<script src="assets/js/format.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/period.js"></script>
<script src="assets/js/router.js"></script>

<script src="views/incubadora.js"></script>
<script src="views/equipe.js"></script>
<script src="views/tarefas.js"></script>
<script src="views/guia.js"></script>

<script>
  window.APP_CONFIG = {
    rotas: [
      ["inicio", "VIEW_EQUIPE_INICIO"],
      ["tarefas", "VIEW_TAREFAS"],
      ["mentorias", "VIEW_MENTORIAS"],
      ["incubadora", "VIEW_INCUBADORA"],
      ["guia", "VIEW_GUIA"],
    ],
    rotaInicial: "inicio",
    fontes: ["incubadora"],
    periodoDe: "incubadora",
    seloDe: "incubadora",
  };
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
